name: storehub
description: "StoreHub: catálogo de productos con login/registro y CRUD sobre la FakeStore API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Peticiones HTTP a la FakeStore API.
  http: ^1.2.2
  # Manejo de estado (ChangeNotifier).
  provider: ^6.1.2
  # Guardado local: usuarios registrados, sesión y catálogo sin conexión.
  shared_preferences: ^2.3.2
  # Cifrado SHA-256 de las contraseñas registradas.
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
